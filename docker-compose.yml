services:
  intranet:
    build: .
    container_name: intranet
    restart: unless-stopped
    ports:
      - "8090:80"
    depends_on:
      - intranet-api
    volumes:
      # La configuración (services.yaml, settings.yaml, logo) vive en un volumen:
      # lo que se agrega desde la web no se pierde al reiniciar ni al redesplegar.
      - intranet-config:/usr/share/nginx/html/config

  intranet-api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: intranet-api
    restart: unless-stopped
    environment:
      # Clave general (puede editar todas las áreas y crear o borrar áreas).
      # Si la dejás vacía y no hay claves por área, cualquiera puede editar.
      ADMIN_PIN: "ardy30fe"
      # Clave propia de cada área, separadas por punto y coma. Ejemplo:
      # AREA_PINS: "ADMINISTRACIÓN=1111;DEPÓSITO=2222;MAYORISTA=3333"
      AREA_PINS: ""
    volumes:
      - intranet-config:/data
      # Respaldo automático de services.yaml antes de cada cambio (últimos 50)
      - intranet-backups:/backups

volumes:
  intranet-config:
  intranet-backups:
