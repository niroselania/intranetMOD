server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para que cargue más rápido
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # Cabeceras básicas de seguridad
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Los yaml de config nunca se cachean: editás y recargás
    location /config/ {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff" always;
        default_type text/plain;
        location ~ \.tmp$ { deny all; }
    }

    # Alta, edición y baja de sitios desde la web
    location /api/ {
        proxy_pass http://intranet-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 32k;
    }

    # La librería no cambia: se cachea una semana
    location /vendor/ {
        expires 7d;
    }
}
